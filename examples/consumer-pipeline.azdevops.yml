# Copy-paste this file into your consumer repo as azure-pipelines.yml
# (or whatever your team's convention is).

trigger:
  branches:
    include: [main]
  paths:
    include: [.checkly/checks.json]

resources:
  repositories:
    - repository: checklyTemplates
      type: github
      endpoint: github-service-connection
      name: devotion-patrick/checkly-templates
      ref: refs/heads/main

stages:
  - template: templates/azuredevops/deploy.yml@checklyTemplates
    parameters:
      # Relative to your repo root.
      configPath: .checkly/checks.json
      checklyCredentialsGroup: checkly-prod
      # Optional. List any *secret* variables (from your variable group)
      # that your check config references via `valueFromEnv`. ADO doesn't
      # expose secret variables to scripts unless they're mapped
      # explicitly; this is how you opt them in. Non-secret variables
      # propagate without listing.
      # secretEnvVars:
      #   - HEALTH_KEY
